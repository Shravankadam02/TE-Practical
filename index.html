<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee; --muted:#8b93a7; --accent:#4f8cff; }

<script>
const practicals = [{"name": "Banker’s Algorithm", "code": "Banker’s Algorithm \nWrite a program to implement Banker’s Algorithm for deadlock avoidance and determine the safe \nsequence.\n#include<stdio.h>\nint main()\n{\n    int p, c, count = 0, i, j;\n    int alc[5][3], max[5][3], need[5][3], safe[5];\n    int available[3], done[5], terminate = 0;\n    printf(\"Enter the number of process and resources\");\n    scanf(\"%d %d\", &p, &c);\n    // p is process and c is different resources\n    printf(\"enter allocation of resource of all process %dx%d matrix\", p, c);\n    for (i = 0; i < p; i++)\n    {\n        for (j = 0; j < c; j++)\n        {\n            scanf(\"%d\", &alc[i][j]);\n        }\n    }\n    printf(\"enter the max resource process required %dx%d matrix\", p, c);\n    for (i = 0; i < p; i++)\n    {\n        for (j = 0; j < c; j++)\n        {\n            scanf(\"%d\", &max[i][j]);\n        }\n    }\n    printf(\"enter the available resource\");\n    for (i = 0; i < c; i++)\n        scanf(\"%d\", &available[i]);\n    printf(\"\\n need resources matrix are\\n\");\n    for (i = 0; i < p; i++)\n    {\n        for (j = 0; j < c; j++)\n        {\n            need[i][j] = max[i][j] - alc[i][j];\n            printf(\"%d\\t\", need[i][j]);\n        }\n        printf(\"\\n\");\n    }\n    /* once process execute variable done will stop them for again execution */\n    for (i = 0; i < p; i++)\n    {\n        done[i] = 0;\n    }\n    while (count < p)\n    {\n        for (i = 0; i < p; i++)\n        {\n            if (done[i] == 0)\n            {\n                for (j = 0; j < c; j++)\n                {\n                    if (need[i][j] > available[j])\n                        break;\n                }\n                // when need matrix is not greater than available matrix then if j==c will true\n                if (j == c)\n                {\n                    safe[count] = i;\n                    done[i] = 1;\n                    /* now process get execute release the resources\n                       and add them in available resources */\n                    for (j = 0; j < c; j++)\n                    {\n                        available[j] += alc[i][j];\n                    }\n                    count++;\n                    terminate = 0;\n                }\n                else\n                {\n                    terminate++;\n                }\n            }\n        }\n        if (terminate == (p - 1))\n        {\n            printf(\"safe sequence does not exist\");\n            break;\n        }\n    }\n    if (terminate != (p - 1))\n    {\n        printf(\"\\n available resource after completion\\n\");\n        for (i = 0; i < c; i++)\n        {\n            printf(\"%d\\t\", available[i]);\n        }\n        printf(\"\\n safe sequence is\\n\");\n        for (i = 0; i < p; i++)\n        {\n            printf(\"p%d ->\\t\", safe[i]);\n        }\n    }\n    return 0;\n}\nFor output:\ngcc assname.c\n./a.out\nEnter the number of process and resources5 3\nenter allocation of resource of all process 5x3 matrix\n0 1 0\n2 0 0\n3 0 2\n2 1 1\n0 0 2\nenter the max resource process required 5x3 matrix\n7 5 3\n3 2 2\n9 0 2\n4 2 2\n5 3 3\nenter the available resource\n3 3 2\n need resources matrix are\n7\t4\t3\t\n1\t2\t2\t\n6\t0\t0\t\n2\t1\t1\t\n5\t3\t1\t\n available resource after completion\n10\t5\t7\t\n safe sequence is\np1 ->\tp3 ->\tp4 ->\tp0 ->\tp2 ->\t"}, {"name": "C-LOOK", "code": ".10. Disk Scheduling – C-LOOK \nWrite a program to implement the C-LOOK disk scheduling algorithm\nC-LOOK.C\n#include<stdio.h>\n#include<stdlib.h> \nint main()\n{\nint RQ[100] , i , j , n , TotalHeadMoment=0 ,initial , size , move,AvgTotalHeadMoment;\nprintf(\"Enter the number of Requests\\n\");\nscanf(\"%d\",&n);\nprintf(\"Enter the Requests sequence\\n\");\nfor( i=0 ;i<n ; i++ )\nscanf(\"%d\",&RQ[i]);\nprintf(\"Enter initial head position\\n\");\nscanf(\"%d\",&initial);\nprintf(\"Enter total disk size\\n\");\nscanf(\"%d\",&size);\nprintf(\"Enter the head movement direction for high 1 and for low 0\\n\");\nscanf(\"%d\",&move);\n// logic for look disk scheduling\n/*logic for sort the request array */\nfor( i=0 ; i<n ; i++ )\n{\nfor( j=0 ; j<n-i-1 ; j++ )\n{\nif( RQ[j] > RQ[j+1] )\n{\nint temp; temp=RQ[j];\nRQ[j]=RQ[j+1];\nRQ[j+1]=temp;\n}\n}\n}\nint index;\nfor( i=0 ; i<n ; i++ )\n{\nif( initial < RQ[i] )\n{\nindex=i;\nbreak;\n}\n}\n// if movement is towards high value\nif( move == 1 )\n{\nfor( i=index ; i<n ; i++ )\n{\nTotalHeadMoment=TotalHeadMoment+abs(RQ[i]-initial);\ninitial=RQ[i];\n}\nfor( i=index-1 ; i>=0 ; i-- )\n{\nTotalHeadMoment=TotalHeadMoment+abs(RQ[i]-initial);\ninitial=RQ[i];\n}\n}\n// if movement is towards low value else\nelse{\nfor( i=index-1 ; i>=0 ; i-- )\n{\nTotalHeadMoment=TotalHeadMoment+abs(RQ[i]-initial);\ninitial=RQ[i];\n}\nfor( i=index ; i<n ; i++ )\n{\nTotalHeadMoment=TotalHeadMoment+abs(RQ[i]-initial);\ninitial=RQ[i];\n}\n}\nprintf(\"Total head movement is %d\",TotalHeadMoment);\nAvgTotalHeadMoment=TotalHeadMoment/n;\nprintf(\"\\n Average Total head movement is %d\",AvgTotalHeadMoment);\nreturn 0;\n}\nOUTPUT:\nEnter the number of Requests\n5\nEnter the Requests sequence\n34 22 12 67 89\nEnter initial head position\n50\nEnter total disk size\n199\nEnter the head movement direction for high 1 and for low 0\n1\nTotal head movement is 116\n Average Total head movement is 23"}, {"name": "Dining Philosophers Problem", "code": " Dining Philosophers Problem \nWrite a program to solve the Dining Philosophers problem using semaphores. Consider deadlock and \nstarvation handling.\n#include <stdio.h>\n#include <stdlib.h>\n#include <pthread.h>\n#include <unistd.h>\n#define NUM_PHILOSOPHERS 5\npthread_mutex_t forks[NUM_PHILOSOPHERS];\npthread_t philosophers[NUM_PHILOSOPHERS];\nint philosopher_ids[NUM_PHILOSOPHERS];\nvoid* philosopher(void* num)\n{\nint id = *(int*)num;\nint left_fork = id;\nint right_fork = (id + 1) % NUM_PHILOSOPHERS;\nwhile (1)\n{\n// Thinking\nprintf(\"Philosopher %d is thinking.\\n\", id);\nusleep(rand() % 1000000);\n  // Asymmetric resource acquisition to prevent deadlock\nif (id % 2 == 0)\n{\npthread_mutex_lock(&forks[left_fork]);\nprintf(\"Philosopher %d picked up left fork %d.\\n\", id, left_fork);\npthread_mutex_lock(&forks[right_fork]);\nprintf(\"Philosopher %d picked up right fork %d.\\n\", id, right_fork);\n}\nelse\n{\npthread_mutex_lock(&forks[right_fork]);\nprintf(\"Philosopher %d picked up right fork %d.\\n\", id, right_fork);\npthread_mutex_lock(&forks[left_fork]);\nprintf(\"Philosopher %d picked up left fork %d.\\n\", id, left_fork);\n}\n// Eating\nprintf(\"Philosopher %d is eating.\\n\", id);\nusleep(rand() % 1000000);\n// Put down forks\npthread_mutex_unlock(&forks[right_fork]);\npthread_mutex_unlock(&forks[left_fork]);\nprintf(\"Philosopher %d finished eating and is putting down forks.\\n\", id);\n}\n}\nint main()\n{\nint i;\n// Initialize mutexes for each fork\nfor (i = 0; i < NUM_PHILOSOPHERS; i++)\n{\npthread_mutex_init(&forks[i], NULL);\n}\n// Create philosopher threads\nfor (i = 0; i < NUM_PHILOSOPHERS; i++)\n{\nphilosopher_ids[i] = i;\npthread_create(&philosophers[i], NULL, philosopher, &philosopher_ids[i]);\n}\n// Join threads (runs indefinitely in this simulation)\nfor (i = 0; i < NUM_PHILOSOPHERS; i++)\n{\npthread_join(philosophers[i], NULL);\n}\n// Destroy mutexes\nfor (i = 0; i < NUM_PHILOSOPHERS; i++)\n{\npthread_mutex_destroy(&forks[i]);\n}\nreturn 0;\n}\nFor output:\ngcc assname.c\n./a.out"}, {"name": "FIFO", "code": ".6. Full-Duplex Communication Using FIFO \nWrite a program to implement full-duplex communication between two processes using FIFO. Count the \ncharacters, words, and lines in a file, save the results in a text file, and send the file contents back to the \nother process.\nFIFO1.C\n#include <string.h>\n#include <stdio.h>\n#include <unistd.h>\n#include <sys/types.h>\n#include <sys/stat.h>\n#include <fcntl.h>\n#define FIFO1 \"fifo1\"\n#define FIFO2 \"fifo2\"\nint main()\n{\n    char buf[100],buf1[100],str;\n    int fd,fd1,i=0;\n    //memset (buf1,'\\0',sizeof(buf1));\n    printf(\"\\nEnter the string : \\n\");\n    while((str=getchar())!='#')\n        buf[i++]=str;\n    puts(buf);\n    mkfifo(\"fifo1\",0666);\n    fd=open(\"fifo1\",O_WRONLY);\n    write(fd,buf,sizeof(buf));\n    printf(\"\\nMessage sent\");\n    close(fd);\n    fd1=open(\"fifo2\",O_RDONLY);\n    read(fd1,buf1,sizeof(buf1));\n    printf(\"\\n\\nMessage received\");\n    printf(\"%s\",buf1);\n    close(fd1);\n    return 0;\n}\nFIFO2.C\n#include <string.h>#include <stdio.h>#include <unistd.h>#include <sys/types.h>#include <sys/stat.h>#include <fcntl.h>\n#define FIFO1 \"fifo1\"#define FIFO2 \"fifo2\"\nint main(){\n    char buf[100],buf1[100];\n    int fd,fd1,words=1,lines=1,characters=1,len,i,count=0;\n    char ch;\n    FILE *fp;\n    fd=open(\"fifo1\",O_RDONLY);\n    memset(buf,'\\0',sizeof(buf));\n    read(fd,buf,sizeof(buf));\n    printf(\"\\nMessage received\\n\");\n    printf(\"%s\",buf);\n    close(fd);\n    for(i=0;buf[i]!='\\0';i++)\n    {\n        if(buf[i]==' ' || buf[i]=='\\n' || buf[i]=='#')\n            words++;\n        if(buf[i]=='\\n' || buf[i]=='#')\n            lines++;\n        if(buf[i]!=' ' && buf[i]!='\\n' && buf[i]!='#')\n            characters++;\n    }\n    printf(\"\\nCounts are :\\nCharacters: %d \\nWords: %d \\nLines: %d\\n\",characters,words,lines);\n    fp=fopen(\"f.txt\",\"w+\");\n    fprintf(fp,\"\\nCharacters: %d\",characters);\n    fprintf(fp,\"\\nWords: %d\",words);\n    fprintf(fp,\"\\nLines: %d\\n\",lines);\n    fclose(fp);\n    fp=fopen(\"f.txt\",\"r\");\n    i=0;\n    while((ch=fgetc(fp))!=EOF)\n    {\n        buf1[i]=ch;\n        i++;\n    }\n    printf(\"\\nBuffer contents\");\n    printf(\"\\n%s\",buf1);\n    fclose(fp);\n    unlink(\"fifo1\");\n    mkfifo(\"fifo2\",0666);\n    fd1=open(\"fifo2\",O_WRONLY);\n    write(fd1,buf1,sizeof(buf1));\n    printf(\"\\nMessage sent\\n\");\n    close(fd1);\n    return 0;}\nFor output:\nstudent@student-HP-ProDesk-600-G4-SFF:~$ cd \nstudent@student-HP-ProDesk-600-G4-SFF:~$ cd Ecom* \nstudent@student-HP-ProDesk-600-G4-SFF:~/Ecomm ass 2$ cd 7a \nstudent@student-HP-ProDesk-600-G4-SFF:~/Ecomm ass 2/7a$ gcc FIFO1.C -o f1 \nstudent@student-HP-ProDesk-600-G4-SFF:~/Ecomm ass 2/7a$ gcc FIFO2.C -o f2 \nstudent@student-HP-ProDesk-600-G4-SFF:~/Ecomm ass 2/7a$ ./f1"}, {"name": "FORK and WAIT", "code": "Process Management – FORK and WAIT \nWrite a program to demonstrate the use of the FORK and WAIT system calls. Create a parent and child process and perform sorting operations. Also demonstrate Zombie and Orphan processes.\n#include <stdio.h>\n#include <unistd.h>\n#include <sys/types.h>\n#include <sys/wait.h>\n#include <stdlib.h>\nvoid ascending(int arr[], int n)\n{ \nint i, j, temp;\n    for (i = 0; i < n; i++) {\n        for (j = i + 1; j < n; j++) {\n            if (arr[i] > arr[j]) {\n                temp = arr[i];\n                arr[i] = arr[j];\n                arr[j] = temp;\n            }\n        }\n    }}\nvoid descending(int arr[], int n)\n{ \nint i, j, temp;\n    for (i = 0; i < n; i++) {\n        for (j = i + 1; j < n; j++) {\n            if (arr[i] < arr[j]) {\n                temp = arr[i];\n                arr[i] = arr[j];\n                arr[j] = temp;\n            }\n        }\n    }}\nint main()\n{\n int a[50], n, i, pid;\n    printf(\"Enter number of elements: \");\n    scanf(\"%d\", &n);\n    printf(\"Enter elements:\\n\");\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n    pid = fork();\n    if (pid < 0)\n    {\n        printf(\"Process creation failed\\n\");\n    }\n    else if (pid == 0)\n    {\n        printf(\"\\nChild Process Created.\\n\");\n        printf(\"Child PID = %d\\n\", getpid());\n        printf(\"Parent PID = %d\\n\", getppid());\n        ascending(a, n);\n        printf(\"Child Process - Ascending Order: \");\n        for (i = 0; i < n; i++)\n            printf(\"%d \", a[i]);\n        printf(\"\\n\");\n        /* Orphan demonstration */\n        sleep(5);\n        printf(\"Child is running after parent exits. Orphan PID = %d\\n\",\n               getpid());\n        exit(0);\n    }\n    else\n    {\n        printf(\"\\nParent Process.\\n\");\n        printf(\"Parent PID = %d\\n\", getpid());\n        printf(\"Child PID = %d\\n\", pid);\n        /* Zombie demonstration */\n        sleep(2);\n        printf(\"\\nZombie state: Parent has not called wait().\\n\");\n        sleep(5);\n        descending(a, n);\n        printf(\"Parent Process - Descending Order: \");\n        for (i = 0; i < n; i++)\n            printf(\"%d \", a[i]);\n        printf(\"\\n\");\n        /* Parent exits before child */\n        printf(\"Parent exiting to demonstrate orphan state.\\n\");\n        return 0;\n    }\nreturn 0;\n}\nFor output:\ngcc assname.c\n./a.out"}, {"name": "pipes", "code": ".7. Full-Duplex Communication Using Pipes \nWrite a program to implement full-duplex communication between a parent and child process using \npipes. Pass a pathname to the child process and return the contents of the specified file to the parent \nprocess.\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <string.h>\n#include <fcntl.h>\n#include <sys/wait.h>\n#define BUFFER_SIZE 1024\nint main()\n{\n    int pipe1[2]; // Parent to Child (carries pathname)\n    int pipe2[2]; // Child to Parent (carries file contents)\n    pid_t pid;\n    char pathname[BUFFER_SIZE];\n    char buffer[BUFFER_SIZE];\n    ssize_t n;\n    // Create the first pipe (Parent -> Child)\n    if (pipe(pipe1) == -1)\n    {\n        perror(\"Pipe 1 creation failed\");\n        exit(EXIT_FAILURE);\n    }\n    // Create the second pipe (Child -> Parent)\n    if (pipe(pipe2) == -1)\n    {\n        perror(\"Pipe 2 creation failed\");\n        exit(EXIT_FAILURE);\n    }\n    // Fork the child process\n    pid = fork();\n    if (pid < 0)\n    {\n        perror(\"Fork failed\");\n        exit(EXIT_FAILURE);\n    }\n    if (pid > 0)\n    {\n        // ---- Parent Process ----\n        close(pipe1[0]); // Close unused read end of Pipe 1\n        close(pipe2[1]); // Close unused write end of Pipe 2\n        printf(\"Enter the file pathname to send to child: \");\n        if (fgets(pathname, BUFFER_SIZE, stdin) != NULL)\n        {\n            // Remove trailing newline if present\n            pathname[strcspn(pathname, \"\\n\")] = 0;\n            // Write pathname to Pipe 1\n            write(pipe1[1], pathname, strlen(pathname) + 1);\n        }\n        close(pipe1[1]); // Finished writing pathname\n        // Read file contents from Pipe 2 and display on standard output\n        printf(\"\\n--- Contents received from Child ---\\n\");\n        while ((n = read(pipe2[0], buffer, BUFFER_SIZE)) > 0)\n        {\n            write(STDOUT_FILENO, buffer, n);\n        }\n        close(pipe2[0]);\n        wait(NULL); // Wait for child to finish\n    }\n    else\n    {\n        // ---- Child Process ----\n        close(pipe1[1]); // Close unused write end of Pipe 1\n        close(pipe2[0]); // Close unused read end of Pipe 2\n        // Read pathname from Pipe 1\n        n = read(pipe1[0], pathname, BUFFER_SIZE);\n        close(pipe1[0]); // Finished reading pathname\n        if (n > 0)\n        {\n            // Open the requested file\n            int fd = open(pathname, O_RDONLY);\n            if (fd < 0)\n            {\n                char *err_msg = \"Error: Could not open the specified file.\\n\";\n                write(pipe2[1], err_msg, strlen(err_msg));\n            }\n            else\n            {\n                // Read contents of the file and write to Pipe 2\n                while ((n = read(fd, buffer, BUFFER_SIZE)) > 0)\n                {\n                    write(pipe2[1], buffer, n);\n                }\n                close(fd);\n            }\n        }\n        close(pipe2[1]); // Finished writing file contents\n        exit(EXIT_SUCCESS);\n    }\n    return 0;\n}\nFor output:\ngcc Ass7.c \n ./a.out"}, {"name": "Producer–Consumer Problem", "code": "3. Producer–Consumer Problem \nWrite a program to implement the Producer–Consumer problem using Counting Semaphores and Mutex locks.\n#include <stdio.h>\n#include <stdlib.h>\n#include <pthread.h>\n#include <semaphore.h>\n#include <unistd.h>\n#define SIZE 10\nsem_t full, empty; pthread_mutex_t mutex;\nint buffer[SIZE];int counter = 0;\nvoid *producer(void *p){\n    int item;\n    item = rand() % 10;\n    sem_wait(&empty);\n    pthread_mutex_lock(&mutex);\n    buffer[counter++] = item;\n    printf(\"\\nProducer produced: %d\", item);\n    pthread_mutex_unlock(&mutex);\n    sem_post(&full);\nreturn NULL;\n}\nvoid *consumer(void *p)\n{\n    int item;\n    sem_wait(&full);\n    pthread_mutex_lock(&mutex);\n    item = buffer[--counter];\n    printf(\"\\nConsumer consumed: %d\", item);\n    pthread_mutex_unlock(&mutex);\n    sem_post(&empty);\n    return NULL;}\nint main(){\n    int n1, n2, i;\n    pthread_t p[10], c[10];\n    printf(\"Enter number of producers: \");\n    scanf(\"%d\", &n1);\n    printf(\"Enter number of consumers: \");\n    scanf(\"%d\", &n2);\n    if(n1 > 10 || n2 > 10 || n1 < 1 || n2 < 1)\n    {\n        printf(\"Enter numbers between 1 and 10\");\n        return 1;\n    }\n    pthread_mutex_init(&mutex, NULL);\n    sem_init(&full, 0, 0);\n    sem_init(&empty, 0, SIZE);\n    for(i = 0; i < n1; i++)\n    {\n        pthread_create(&p[i], NULL, producer, NULL);\n    }\n    for(i = 0; i < n2; i++)\n    {\n        pthread_create(&c[i], NULL, consumer, NULL);\n    }\n    for(i = 0; i < n1; i++)\n    {\n        pthread_join(p[i], NULL);\n    }\n    for(i = 0; i < n2; i++)\n    {\n        pthread_join(c[i], NULL);\n    }\n    pthread_mutex_destroy(&mutex);\n    sem_destroy(&full);\n    sem_destroy(&empty);\n    return 0;}\nFor output:\ngcc assname.c\n./a.out"}, {"name": "SCAN", "code": ".9 Disk Scheduling – SCAN \nWrite a program to implement the SCAN disk scheduling algorithm.\nSCAN.C\n#include <stdio.h>\nint main()\n{\n    int queue[20], n, head, max, i, j, temp;\n    int seek = 0, diff;\n    float avg;\n    printf(\"Enter maximum range of disk: \");\n    scanf(\"%d\", &max);\n    printf(\"Enter number of requests: \");\n    scanf(\"%d\", &n);\n    printf(\"Enter initial head position: \");\n    scanf(\"%d\", &head);\n    printf(\"Enter disk requests: \");\n    for(i = 0; i < n; i++)\n    {\n        scanf(\"%d\", &queue[i]);\n    }\n    // Sort requests in ascending order\n    for(i = 0; i < n-1; i++)\n    {\n        for(j = i+1; j < n; j++)\n        {\n            if(queue[i] > queue[j])\n            {\n                temp = queue[i];\n                queue[i] = queue[j];\n                queue[j] = temp;\n            }\n        }\n    }\n    // Find head position in sorted queue\n    for(i = 0; i < n; i++)\n    {\n        if(queue[i] >= head)\n            break;\n    }\n    printf(\"\\nDisk Head Movement:\\n\");\n    // Move towards higher cylinder numbers\n    for(j = i; j < n; j++)\n    {\n        diff = queue[j] - head;\n        seek = seek + diff;\n        printf(\"%d -> %d (Seek = %d)\\n\", head, queue[j], diff);\n        head = queue[j];\n    }\n    // Move to maximum disk range\n    diff = max - head;\n    seek = seek + diff;\n    printf(\"%d -> %d (Seek = %d)\\n\", head, max, diff);\n    head = max;\n    // Reverse direction and move towards lower numbers\n    for(j = i-1; j >= 0; j--)\n    {\n        diff = head - queue[j];\n        seek = seek + diff;\n        printf(\"%d -> %d (Seek = %d)\\n\", head, queue[j], diff);\n        head = queue[j];\n    }\n    avg = (float)seek / n;\n    printf(\"\\nTotal Seek Time = %d\", seek);\n    printf(\"\\nAverage Seek Time = %.2f\\n\", avg);\n    return 0;\n}\nOUTPUT:\nEnter maximum range of disk: 199\nEnter number of requests: 5\nEnter initial head position: 50\nEnter disk requests: 21 12 86 456 09\nDisk Head Movement:\n50 -> 86 (Seek = 36)\n86 -> 456 (Seek = 370)\n456 -> 199 (Seek = -257)\n199 -> 21 (Seek = 178)\n21 -> 12 (Seek = 9)\n12 -> 9 (Seek = 3)\nTotal Seek Time = 339\nAverage Seek Time = 67.80"}, {"name": "Shell Programming", "code": "Shell Programming.\n#!/bin/bash\nwhile true\ndo\necho \"1. Create address book\"\necho \"2. View address book\"\necho \"3. Insert record\"\necho \"4. Search record\"\necho \"5. Delete record\"\necho \"6. Modify record\"\necho \"7. Exit\"\necho -n \"Enter your choice: \"\nread ch\nbook=\"address_book.txt\"\ncase $ch in\n1)\n    if [ -f \"$book\" ]; then\n        echo \"$book is already created\"\n    else\n        touch \"$book\"\n        echo \"$book created successfully\"\n    fi\n    ;;\n2)\n    if [ -f \"$book\" ]; then\n        cat \"$book\"\n    else\n        echo \"Address book not found\"\n    fi\n    ;;\n3)\n    if [ -f \"$book\" ]; then\n        while true\n        do\n            echo \"Enter name of student\"\n            read name\n            echo \"Enter phone no of student\"\n            read phone_no\n            echo \"Enter email of student\"\n            read email\n            echo \"$name|$phone_no|$email\" >> \"$book\"\n            echo \"Record inserted\"\n            echo \"Do you want to enter another record? (Y/N)\"\n            read choice\n            if [ \"$choice\" != \"Y\" ] && [ \"$choice\" != \"y\" ]; then\n                break\n            fi\n        done\n    else\n        echo \"Address book not found. Please select option 1 first.\"\n    fi\n    ;;\n4)\n    if [ -f \"$book\" ]; then\n        echo \"Enter the name you want to search:\"\n        read name\n        grep -i \"$name\" \"$book\"\n    else\n        echo \"Address book not found\"\n    fi\n    ;;\n5)\n    if [ -f \"$book\" ]; then\n        echo \"Enter exact mobile no or name for delete the record\"\n        read phone_no\n        grep -iv \"$phone_no\" \"$book\" > temp.txt\n        mv temp.txt \"$book\"\n        echo \"Record deleted successfully\"\n    else\n        echo \"Address book not found\"\n    fi\n    ;;\n6)\n    if [ -f \"$book\" ]; then\n        echo \"Enter name to modify\"\n        read name\n        if grep -i \"$name\" \"$book\"; then\n            grep -iv \"$name\" \"$book\" > temp.txt\n            echo \"Enter new phone no\"\n            read phone_no\n            echo \"Enter new email\"\n            read email\n            echo \"$name|$phone_no|$email\" >> temp.txt\n            mv temp.txt \"$book\"\n            echo \"Record modified\"\n        else\n            echo \"Record not found\"\n        fi\n    else\n        echo \"Address book not found\"\n    fi\n    ;;\n7)\n    echo \"Exit\"\n    break\n    ;;\n*)\n    echo \"Invalid choice\"\n    ;;\nesac\ndone"}, {"name": "SSTF", "code": ".8. Disk Scheduling – SSTF \nWrite a program to implement the Shortest Seek Time First (SSTF) disk scheduling algorithm.\nSSTF.C\n#include<stdio.h> \n#include<stdlib.h> \nint main() \n{ \nint ReadyQueue[100], I ,n, TotalHeadMoment=0, initial, count=0, AvgTotalHeadMoment; \n// The number of requests \nprintf(\"Enter the Total No. of Requests:\"); \nscanf(\"%d\",&n); \n//Enter the requests sequence \nprintf(\"Enter Request sequence:\"); \nfor( i=0 ; i<n ; i++ ) \nscanf(\"%d\",&ReadyQueue[i] ); \nprintf(\"\\n Enter the initial head position:\"); \n//Enter the initial head position \nscanf(\"%d\",&initial); \nwhile(count != n) \n{ \nint min=1000, diff, index ;\nfor( i=0 ; i<n ; i++ ) \n{ \ndiff=abs(ReadyQueue[i]-initial); \nif(min>diff) \n{ \nmin=diff; \nindex=i; \n} \n} \nTotalHeadMoment = TotalHeadMoment + min; \ninitial=ReadyQueue[index]; \nReadyQueue[index] = 1000; \ncount++; \n} \nprintf(\"\\n Total head movement is %d\",TotalHeadMoment); \nAvgTotalHeadMoment=TotalHeadMoment/n; \nprintf(\"\\n Average Total head movement is %d\", AvgTotalHeadMoment ); \n} \nOUTPUT: \nstudent@student-HP-ProDesk-600-G4-SFF:~/Ecomm ass 2$ gcc sstf.c \nstudent@student-HP-ProDesk-600-G4-SFF:~/Ecomm ass 2$ ./a.out \nEnter the Total No. of Requests:5 \nEnter Request sequence:82 170 43 140 24 \nEnter the initial head position:50 \nTotal head movement is 172 \nAverage Total head movement is 34"}];
const list = document.getElementById("list");
const titleEl = document.getElementById("title");
const codeEl = document.getElementById("code");
const copyBtn = document.getElementById("copy");
let current = 0;

function show(i) {
  current = i;
  titleEl.textContent = practicals[i].name;
  codeEl.textContent = practicals[i].code;
  codeEl.scrollTop = 0;
  [...list.children].forEach((b, j) => b.classList.toggle("active", j === i));
  history.replaceState(null, "", "#" + i);
}

practicals.forEach((p, i) => {
  const b = document.createElement("button");
  b.textContent = p.name;
  b.onclick = () => show(i);
  list.appendChild(b);
});

copyBtn.onclick = async () => {
  const text = practicals[current].code;
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  copyBtn.textContent = "Copied ✓";
  copyBtn.classList.add("done");
  setTimeout(() => { copyBtn.textContent = "Copy"; copyBtn.classList.remove("done"); }, 1200);
};

const start = parseInt(location.hash.slice(1));
show(start >= 0 && start < practicals.length ? start : 0);
</script>
